<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eval — Bid Parser</title>
  <style>
    :root {
      --bg:      #0b0b0e;
      --s0:      #111115;
      --s1:      #17171c;
      --s2:      #1e1e24;
      --border:  rgba(255,255,255,.06);
      --border2: rgba(255,255,255,.10);
      --text:    #e8e8ef;
      --muted:   #5a5a6e;
      --dim:     #3a3a4e;
      --violet:  #8b5cf6;
      --violet-d:#6d3dd4;
      --green:   #10d9a0;
      --amber:   #f0a14a;
      --red:     #f26060;
      --blue:    #5ba3f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column;
      font-size: 13px; line-height: 1.5;
    }

    /* ── Header ── */
    header {
      background: var(--s0); border-bottom: 1px solid var(--border);
      padding: 0 20px; height: 46px; display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }
    .logo { font-size: 13px; font-weight: 600; color: var(--text); }
    .logo em { color: var(--muted); font-style: normal; }
    .back-link { font-size: 12px; color: var(--muted); text-decoration: none; }
    .back-link:hover { color: var(--text); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    #run-all-progress { font-size: 12px; color: var(--muted); }

    /* ── Top bar ── */
    #overall-bar-wrap { display:none; height: 2px; background: var(--s1); flex-shrink: 0; }
    #overall-bar { height: 100%; background: var(--violet); transition: width .4s; width: 0%; }

    /* ── Summary ── */
    .summary {
      background: var(--s0); border-bottom: 1px solid var(--border);
      padding: 8px 20px; display: flex; align-items: center; gap: 0; flex-shrink: 0;
    }
    .stat { padding: 0 16px; border-right: 1px solid var(--border); }
    .stat:first-child { padding-left: 0; }
    .stat:last-child  { border-right: none; }
    .stat-val { font-size: 17px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
    .stat-val.green  { color: var(--green); }
    .stat-val.violet { color: var(--violet); }
    .stat-val.blue   { color: var(--blue); }
    .stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 2px; }

    /* ── Buttons ── */
    .btn {
      border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px;
      cursor: pointer; font-weight: 500; transition: all .12s; display: inline-flex;
      align-items: center; gap: 5px; font-family: inherit;
    }
    .btn-primary { background: var(--violet); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--violet-d); }
    .btn-primary:disabled { opacity: .35; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border2); }
    .btn-ghost:hover { color: var(--text); border-color: var(--dim); }
    .btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(242,96,96,.2); }
    .btn-danger:hover { background: rgba(242,96,96,.08); }

    /* ── Main layout: doc-list | pdf viewer | results ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Doc list ── */
    .doc-list {
      width: 300px; min-width: 300px; overflow-y: auto; padding: 10px;
      background: var(--s0); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 3px;
    }
    .panel-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .7px; color: var(--muted); padding: 4px 4px 8px;
    }

    /* ── Doc card ── */
    .doc-card {
      background: transparent; border-radius: 7px;
      border: 1px solid transparent; padding: 10px; cursor: pointer;
      transition: background .1s, border-color .1s;
    }
    .doc-card:hover  { background: var(--s1); border-color: var(--border); }
    .doc-card.active { background: var(--s2); border-color: var(--violet); }
    .doc-card.running { border-color: var(--amber) !important; background: var(--s1); }

    .card-top { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
    .card-name { font-size: 11px; font-weight: 500; color: var(--text); flex: 1; line-height: 1.45; word-break: break-word; }
    .card-actions { display: flex; gap: 3px; flex-shrink: 0; }

    /* Compact inline score for doc card */
    .card-scores { display: flex; align-items: center; gap: 8px; }
    .card-f1 { font-size: 20px; font-weight: 800; line-height: 1; letter-spacing: -.03em; flex-shrink: 0; }
    .card-prf { display: flex; flex-direction: column; gap: 0; flex: 1; }
    .card-pr-row { display: flex; gap: 10px; }
    .card-pr-item .pv { font-size: 12px; font-weight: 600; line-height: 1; }
    .card-pr-item .pl { font-size: 9px; color: var(--muted); }
    .card-pr-item.p .pv { color: var(--violet); }
    .card-pr-item.r .pv { color: var(--blue); }
    .card-counts { display: flex; gap: 8px; margin-top: 3px; }
    .cc { font-size: 10px; font-weight: 600; }
    .cc.green  { color: var(--green); }
    .cc.red    { color: var(--red); }
    .cc.amber  { color: var(--amber); }
    .not-run   { font-size: 11px; color: var(--dim); }

    /* Mini progress */
    .mini-progress { margin-top: 6px; }
    .mini-phase { font-size: 10px; color: var(--muted); margin-bottom: 3px; display: flex; justify-content: space-between; }
    .mini-phase strong { color: var(--text); font-weight: 500; font-size: 10px; }
    .progress-track { height: 2px; background: var(--border2); border-radius: 1px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 1px; transition: width .4s; background: var(--violet); }
    .progress-fill.indet { width: 35%; animation: indet 1.4s infinite ease-in-out; }
    @keyframes indet { 0%{transform:translateX(-100%)} 100%{transform:translateX(400%)} }

    .card-footer { margin-top: 6px; display: flex; align-items: center; gap: 6px; }
    .cdot { width: 5px; height: 5px; border-radius: 50%; }
    .cdot.hit  { background: var(--green); }
    .cdot.miss { background: var(--dim); }
    .clabel { font-size: 10px; color: var(--muted); }
    .ctime  { font-size: 10px; color: var(--dim); margin-left: auto; }

    /* ── PDF pane ── */
    .pdf-pane {
      flex: 1; display: flex; flex-direction: column;
      background: #1a1a1f; border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .pdf-toolbar {
      height: 38px; background: var(--s1); border-bottom: 1px solid var(--border);
      padding: 0 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .pdf-doc-name { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    #pdf-frame { flex: 1; border: none; background: #1a1a1f; }
    .pdf-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: var(--muted); gap: 8px;
    }
    .pdf-empty .icon { font-size: 28px; opacity: .2; }
    .pdf-empty .em { font-size: 12px; color: var(--dim); }

    /* ── Results pane ── */
    .results-pane {
      width: 460px; min-width: 380px; display: flex; flex-direction: column;
      overflow: hidden; background: var(--bg);
    }

    /* Results header */
    .res-header {
      padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .res-title { font-size: 12px; font-weight: 600; color: var(--text); }
    .res-meta  { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .res-scores { display: flex; gap: 16px; margin-top: 10px; }
    .rs { }
    .rs .rv { font-size: 22px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
    .rs .rl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
    .rs.f1  .rv { color: var(--green); }
    .rs.pre .rv { color: var(--violet); }
    .rs.rec .rv { color: var(--blue); }
    .res-counts { display: flex; gap: 12px; margin-top: 8px; }
    .rcnt { font-size: 12px; font-weight: 600; }
    .rcnt.green  { color: var(--green); }
    .rcnt.red    { color: var(--red); }
    .rcnt.amber  { color: var(--amber); }

    /* Waiting/running state in results pane */
    .res-waiting {
      flex: 1; display: flex; flex-direction: column; gap: 12px;
      padding: 16px; overflow: hidden;
    }
    .waiting-msg {
      font-size: 12px; color: var(--muted); padding: 20px 0 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .spinner {
      width: 12px; height: 12px; border: 2px solid var(--border2);
      border-top-color: var(--violet); border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Log console */
    .log-box {
      background: var(--s0); border: 1px solid var(--border);
      border-radius: 7px; overflow: hidden; display: flex; flex-direction: column;
      min-height: 0; flex: 1;
    }
    .log-box-hdr {
      padding: 6px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .log-box-title { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
    .log-toggle { font-size: 10px; color: var(--muted); cursor: pointer; background: none; border: none; font-family: inherit; }
    .log-toggle:hover { color: var(--text); }
    .log-body {
      overflow-y: auto; padding: 8px 12px; flex: 1;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    .log-line { font-size: 11px; line-height: 1.8; white-space: pre-wrap; display: flex; gap: 10px; }
    .log-ts   { color: var(--dim); flex-shrink: 0; min-width: 50px; }
    .log-msg  { color: #808098; }
    .log-msg.success { color: var(--green); }
    .log-msg.error   { color: var(--red); }
    .log-msg.parser  { color: #6fa8f5; }
    .log-msg.warning { color: var(--amber); }

    /* Tabs + table (shown after results load) */
    .res-tabs {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .tabs-bar {
      display: flex; border-bottom: 1px solid var(--border);
      padding: 0 16px; flex-shrink: 0;
    }
    .tab-btn {
      padding: 8px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
      border: none; background: none; border-bottom: 2px solid transparent;
      color: var(--muted); transition: color .12s; font-family: inherit;
    }
    .tab-btn:hover  { color: var(--text); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--violet); }
    .tab-ct { font-size: 10px; color: var(--muted); margin-left: 3px; }

    .street-table { flex: 1; overflow-y: auto; }
    .street-row {
      display: grid; grid-template-columns: 2fr 1.2fr 1.2fr 60px;
      padding: 7px 16px; border-bottom: 1px solid var(--border);
      font-size: 11.5px; align-items: center;
    }
    .street-row:hover { background: var(--s0); }
    .street-row.clickable { cursor: pointer; }
    .street-row.clickable:hover { background: rgba(139,92,246,.07); }
    .street-row.hdr {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .5px; color: var(--muted); background: var(--s0);
      border-bottom: 1px solid var(--border2); position: sticky; top: 0; z-index: 1;
    }
    .street-row.missed  { border-left: 2px solid var(--red); }
    .street-row.extra   { border-left: 2px solid var(--amber); }
    .street-row.matched { border-left: 2px solid var(--green); }
    .cell-name  { font-weight: 500; color: var(--text); }
    .cell-limit { color: var(--muted); }
    .cell-page  { color: var(--dim); }
    .cell-score { font-size: 11px; font-weight: 700; color: var(--green); }
    .cell-tab   { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .no-rows    { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 12px; }

    /* Empty right pane */
    .right-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px; color: var(--muted);
    }
    .right-empty .icon { font-size: 28px; opacity: .15; }
    .right-empty .em   { font-size: 12px; color: var(--dim); }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--s2); color: var(--text); border: 1px solid var(--border2);
      padding: 9px 14px; border-radius: 7px; font-size: 12px; font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,.5); opacity: 0;
      transition: opacity .2s; pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--s2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--dim); }
  </style>
</head>
<body>

<header>
  <div class="logo">bid-parser <em>/ eval</em></div>
  <a class="back-link" href="/">← back</a>
  <div class="header-right">
    <span id="run-all-progress" style="display:none"></span>
    <button class="btn btn-primary" id="run-all-btn" onclick="runAll()">▶ Run All</button>
  </div>
</header>

<div id="overall-bar-wrap"><div id="overall-bar"></div></div>

<div class="summary">
  <div class="stat"><div class="stat-val" id="s-docs">—</div><div class="stat-lbl">Docs</div></div>
  <div class="stat"><div class="stat-val" id="s-truth">—</div><div class="stat-lbl">Truth Streets</div></div>
  <div class="stat"><div class="stat-val green" id="s-f1">—</div><div class="stat-lbl">F1</div></div>
  <div class="stat"><div class="stat-val violet" id="s-precision">—</div><div class="stat-lbl">Precision</div></div>
  <div class="stat"><div class="stat-val blue" id="s-recall">—</div><div class="stat-lbl">Recall</div></div>
  <div class="stat"><div class="stat-val" id="s-run">0 / —</div><div class="stat-lbl">Run</div></div>
</div>

<div class="layout">

  <!-- ── Doc list ── -->
  <div class="doc-list" id="doc-list">
    <div class="panel-label">Documents</div>
    <p style="color:var(--muted);font-size:11px;padding:12px 4px">Loading...</p>
  </div>

  <!-- ── PDF viewer ── -->
  <div class="pdf-pane" id="pdf-pane">
    <div class="pdf-toolbar">
      <span class="pdf-doc-name" id="pdf-doc-name">No document selected</span>
    </div>
    <div class="pdf-empty" id="pdf-empty">
      <div class="icon">⬚</div>
      <div class="em">Select a document to preview</div>
    </div>
    <iframe id="pdf-frame" style="display:none"></iframe>
  </div>

  <!-- ── Results pane ── -->
  <div class="results-pane" id="results-pane">

    <!-- Empty state (no doc selected) -->
    <div class="right-empty" id="res-empty">
      <div class="icon">◈</div>
      <div class="em">Select a document</div>
    </div>

    <!-- Truth view (shown whenever a doc is selected, before eval runs) -->
    <div id="res-truth" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div class="res-header">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <div class="res-title" id="r-title-truth">—</div>
            <div class="res-meta"  id="r-meta-truth"></div>
          </div>
          <button class="btn btn-primary" id="r-run-btn" onclick="runFromPanel()">▶ Run Eval</button>
        </div>
      </div>
      <div style="flex:1;overflow:auto;padding:14px 16px">
        <pre id="truth-pre" style="font-family:'SF Mono','Fira Code',monospace;font-size:11px;line-height:1.7;color:#a0a0b8;white-space:pre-wrap;word-break:break-word">Loading…</pre>
      </div>
    </div>

    <!-- Running: logs -->
    <div id="res-running" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div class="res-header">
        <div class="res-title" id="r-title-running">—</div>
        <div class="res-meta">
          <span id="r-phase-label" style="color:var(--violet)">Loading…</span>
          <span id="r-chunk-info" style="color:var(--muted)"></span>
        </div>
        <div style="margin-top:8px">
          <div class="progress-track" style="height:3px">
            <div class="progress-fill indet" id="r-progress-fill"></div>
          </div>
        </div>
      </div>
      <div class="res-waiting">
        <div class="waiting-msg" id="r-wait-msg">
          <div class="spinner"></div>
          <span>Processing…</span>
        </div>
        <div class="log-box">
          <div class="log-box-hdr">
            <span class="log-box-title">Live Log</span>
          </div>
          <div class="log-body" id="log-body-running"></div>
        </div>
      </div>
    </div>

    <!-- Done: scores + table -->
    <div id="res-done" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div class="res-header">
        <div class="res-title" id="r-title-done">—</div>
        <div class="res-meta"  id="r-meta-done"></div>
        <div class="res-scores">
          <div class="rs f1" ><div class="rv" id="r-f1">—</div><div class="rl">F1</div></div>
          <div class="rs pre"><div class="rv" id="r-precision">—</div><div class="rl">Precision</div></div>
          <div class="rs rec"><div class="rv" id="r-recall">—</div><div class="rl">Recall</div></div>
        </div>
        <div class="res-counts">
          <span class="rcnt green" id="r-matched">—</span>
          <span class="rcnt red"   id="r-missed">—</span>
          <span class="rcnt amber" id="r-extra">—</span>
        </div>
        <!-- Collapsed log (shown after run completes) -->
        <div id="log-done-wrap" style="display:none;margin-top:8px">
          <div class="log-box" style="max-height:120px">
            <div class="log-box-hdr">
              <span class="log-box-title">Log</span>
              <button class="log-toggle" id="log-done-toggle" onclick="toggleDoneLog()">expand</button>
            </div>
            <div class="log-body" id="log-body-done" style="display:none"></div>
          </div>
        </div>
      </div>
      <div class="res-tabs">
        <div class="tabs-bar">
          <button class="tab-btn active" id="tab-missed"  onclick="switchTab('missed')">Missed <span class="tab-ct" id="tab-missed-ct"></span></button>
          <button class="tab-btn"        id="tab-extra"   onclick="switchTab('extra')">Extra <span class="tab-ct" id="tab-extra-ct"></span></button>
          <button class="tab-btn"        id="tab-matched" onclick="switchTab('matched')">Matched <span class="tab-ct" id="tab-matched-ct"></span></button>
          <button class="tab-btn"        id="tab-json"    onclick="switchTab('json')">Eval JSON</button>
          <button class="tab-btn"        id="tab-truth"   onclick="switchTab('truth')">Truth JSON <span class="tab-ct" id="tab-truth-ct"></span></button>
        </div>
        <div class="street-table" id="street-table"></div>
        <div id="json-view" style="display:none;flex:1;overflow:auto;padding:14px 16px">
          <pre id="json-pre" style="font-family:'SF Mono','Fira Code',monospace;font-size:11px;line-height:1.7;color:#a0a0b8;white-space:pre-wrap;word-break:break-word"></pre>
        </div>
        <div id="truth-view" style="display:none;flex:1;overflow:auto;padding:14px 16px">
          <pre id="truth-pre-done" style="font-family:'SF Mono','Fira Code',monospace;font-size:11px;line-height:1.7;color:#a0a0b8;white-space:pre-wrap;word-break:break-word"></pre>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allDocs = [], selectedDoc = null, selectedResults = null;
let currentTab = 'missed', doneLogVisible = false;
let runningJobs = {};
let runAllTotal = 0, runAllDone = 0;
const runningJobProgress = {};

async function init() { await loadDocs(); }

async function loadDocs() {
  const res = await fetch('/eval/docs');
  allDocs = await res.json();
  renderDocList();
  updateSummary();
}

// ── Summary ──────────────────────────────────────────────────────────────────
function updateSummary() {
  const withR = allDocs.filter(d => d.f1 !== null);
  set('s-docs',  allDocs.length);
  set('s-truth', allDocs.reduce((s,d)=>s+(d.total_truth||0),0).toLocaleString());
  set('s-run',   `${withR.length} / ${allDocs.length}`);
  if (!withR.length) { ['s-f1','s-precision','s-recall'].forEach(id=>set(id,'—')); return; }
  const tm = withR.reduce((s,d)=>s+(d.matched_count||0),0);
  const te = withR.reduce((s,d)=>s+(d.extra_count||0),0);
  const tt = withR.reduce((s,d)=>s+(d.total_truth||0),0);
  const p  = tm/(tm+te)||0, r = tm/tt||0, f1 = 2*p*r/(p+r)||0;
  set('s-f1', pct(f1)); set('s-precision', pct(p)); set('s-recall', pct(r));
}

// ── Doc list ─────────────────────────────────────────────────────────────────
function renderDocList() {
  const list = document.getElementById('doc-list');
  list.innerHTML = '<div class="panel-label">Documents</div>' + allDocs.map(renderCard).join('');
}

function renderCard(d) {
  const isRunning = !!runningJobs[d.key];
  const hasR = d.f1 !== null;
  const f1v  = d.f1 || 0;
  const f1color = !hasR ? 'var(--dim)' : f1v >= .8 ? 'var(--green)' : f1v >= .5 ? 'var(--amber)' : 'var(--red)';

  const scores = hasR ? `
    <div class="card-scores">
      <div class="card-f1" style="color:${f1color}">${Math.round(f1v*100)}<span style="font-size:13px;font-weight:500;color:var(--muted)">%</span></div>
      <div class="card-prf">
        <div class="card-pr-row">
          <div class="card-pr-item p"><div class="pv">${pct(d.precision)}</div><div class="pl">P</div></div>
          <div class="card-pr-item r"><div class="pv">${pct(d.recall)}</div><div class="pl">R</div></div>
        </div>
        <div class="card-counts">
          <span class="cc green">✓${d.matched_count}</span>
          <span class="cc red">✗${d.missed_count}</span>
          <span class="cc amber">+${d.extra_count}</span>
        </div>
      </div>
    </div>` : `<div class="not-run" style="margin-bottom:2px">not run yet</div>`;

  let progressHtml = '';
  if (isRunning) {
    const p  = runningJobProgress[d.key] || {};
    const ph = p.phase || 'loading';
    const lbl = {loading:'Loading',scanning:'Scanning',parsing:'Extracting',matching:'Matching',done:'Done'}[ph]||ph;
    const ci  = p.total_chunks > 0 ? `${p.chunks_done}/${p.total_chunks}` : '';
    const si  = p.streets_found > 0 ? `· ${p.streets_found}` : '';
    const fill = p.total_chunks > 0 ? Math.round((p.chunks_done/p.total_chunks)*100) : 0;
    progressHtml = `
      <div class="mini-progress">
        <div class="mini-phase"><strong>${lbl}</strong><span>${ci} ${si}</span></div>
        <div class="progress-track">
          <div class="progress-fill ${fill===0?'indet':''}" style="width:${fill}%"></div>
        </div>
      </div>`;
  }

  const clearBtn = (d.has_parser_cache || d.has_eval_cache)
    ? `<button class="btn btn-danger" style="padding:3px 7px;font-size:11px" onclick="clearCache(event,'${esc(d.key)}')">×</button>` : '';

  return `
    <div class="doc-card ${selectedDoc===d.key?'active':''} ${isRunning?'running':''}"
         id="card-${cid(d.key)}" onclick="selectDoc('${esc(d.key)}')">
      <div class="card-top">
        <div class="card-name">${d.key}</div>
        <div class="card-actions">
          <button class="btn btn-primary" style="padding:3px 8px;font-size:11px"
            onclick="runDoc(event,'${esc(d.key)}')" ${isRunning?'disabled':''}>▶</button>
          ${clearBtn}
        </div>
      </div>
      ${scores}
      ${progressHtml}
      <div class="card-footer">
        <div class="cdot ${d.has_parser_cache?'hit':'miss'}"></div>
        <span class="clabel">${d.has_parser_cache?'cached':'no cache'}</span>
        ${d.eval_cache_time?`<span class="ctime">${d.eval_cache_time}</span>`:''}
      </div>
    </div>`;
}

// ── Select doc ────────────────────────────────────────────────────────────────
async function selectDoc(key) {
  selectedDoc = key;
  renderDocList();
  loadPdf(key);

  // Always load truth JSON immediately
  showTruthState(key);

  // If currently running, switch to running state
  if (runningJobs[key]) {
    showRunningState(key);
    return;
  }

  // Try to load eval results
  const res = await fetch(`/eval/results/${encodeURIComponent(key)}`);
  const data = await res.json();
  if (!data.error) {
    selectedResults = data;
    currentTab = 'missed';
    showDoneState(data);
  }
  // else: stay on truth state
}

let truthCache = {};  // doc_key -> truth data

async function showTruthState(key) {
  document.getElementById('res-empty').style.display   = 'none';
  document.getElementById('res-running').style.display = 'none';
  document.getElementById('res-done').style.display    = 'none';
  const el = document.getElementById('res-truth');
  el.style.display = 'flex';
  set('r-title-truth', key);
  set('r-meta-truth', 'Ground truth — loading…');
  document.getElementById('truth-pre').textContent = 'Loading…';

  if (!truthCache[key]) {
    const r = await fetch(`/eval/truth/${encodeURIComponent(key)}`);
    truthCache[key] = await r.json();
  }
  const t = truthCache[key];
  if (t.error) {
    document.getElementById('truth-pre').textContent = 'Error: ' + t.error;
    set('r-meta-truth', 'Error loading ground truth');
    return;
  }
  set('r-meta-truth', `${t.count} ground truth streets`);
  document.getElementById('truth-pre').textContent = JSON.stringify(t.streets, null, 2);
}

function loadPdf(key) {
  set('pdf-doc-name', key);
  const frame = document.getElementById('pdf-frame');
  const empty = document.getElementById('pdf-empty');
  frame.src = `/eval/pdf/${encodeURIComponent(key)}`;
  frame.style.display = 'block';
  empty.style.display = 'none';
}

// ── State transitions ─────────────────────────────────────────────────────────
function showResEmpty() {
  document.getElementById('res-empty').style.display   = 'flex';
  document.getElementById('res-running').style.display = 'none';
  document.getElementById('res-done').style.display    = 'none';
  document.getElementById('res-truth').style.display   = 'none';
}

function showRunningState(key) {
  document.getElementById('res-empty').style.display   = 'none';
  document.getElementById('res-done').style.display    = 'none';
  document.getElementById('res-truth').style.display   = 'none';
  const el = document.getElementById('res-running');
  el.style.display = 'flex';
  set('r-title-running', key);
  updateRunningHeader(runningJobProgress[key] || {});
}

function showDoneState(data) {
  document.getElementById('res-empty').style.display   = 'none';
  document.getElementById('res-running').style.display = 'none';
  document.getElementById('res-truth').style.display   = 'none';
  const el = document.getElementById('res-done');
  el.style.display = 'flex';

  set('r-title-done',  data.doc_key);
  set('r-meta-done',   data.timestamp ? `Last run: ${new Date(data.timestamp).toLocaleString()}` : '');
  set('r-f1',          pct(data.f1));
  set('r-precision',   pct(data.precision));
  set('r-recall',      pct(data.recall));
  set('r-matched',     `✓ ${data.matched_count} matched`);
  set('r-missed',      `✗ ${data.missed_count} missed`);
  set('r-extra',       `+ ${data.extra_count} extra`);
  set('tab-missed-ct',  data.missed_count  != null ? `(${data.missed_count})`  : '');
  set('tab-extra-ct',   data.extra_count   != null ? `(${data.extra_count})`   : '');
  set('tab-matched-ct', data.matched_count != null ? `(${data.matched_count})` : '');

  // Populate collapsed log
  if (data.logs && data.logs.length) {
    renderLogs('log-body-done', data.logs, false);
    document.getElementById('log-done-wrap').style.display = 'block';
  } else {
    document.getElementById('log-done-wrap').style.display = 'none';
  }

  const t = truthCache[data.doc_key];
  set('tab-truth-ct', t ? `(${t.count})` : '');

  ['missed','extra','matched','json','truth'].forEach(tab => {
    const el = document.getElementById('tab-'+tab);
    if (el) el.classList.toggle('active', tab === currentTab);
  });
  _applyTabView(data);
}

function _applyTabView(data) {
  const tbl = document.getElementById('street-table');
  const jv  = document.getElementById('json-view');
  const tv  = document.getElementById('truth-view');
  tbl.style.display = (currentTab === 'json' || currentTab === 'truth') ? 'none' : '';
  jv.style.display  = currentTab === 'json'  ? 'block' : 'none';
  tv.style.display  = currentTab === 'truth' ? 'block' : 'none';
  if (currentTab === 'json') {
    document.getElementById('json-pre').textContent = JSON.stringify(data || selectedResults, null, 2);
  } else if (currentTab === 'truth') {
    const t = data ? truthCache[data.doc_key] : truthCache[selectedDoc];
    document.getElementById('truth-pre-done').textContent = t ? JSON.stringify(t.streets, null, 2) : 'Loading…';
    if (!t && selectedDoc) fetch(`/eval/truth/${encodeURIComponent(selectedDoc)}`)
      .then(r=>r.json()).then(d=>{ truthCache[selectedDoc]=d; document.getElementById('truth-pre-done').textContent=JSON.stringify(d.streets,null,2); });
  } else {
    renderStreetTable();
  }
}

function updateRunningHeader(p) {
  const ph = p.phase || 'loading';
  const lbl = {loading:'Loading…',scanning:'Scanning pages…',parsing:'Extracting with AI…',matching:'Matching streets…',done:'Done'}[ph]||ph;
  set('r-phase-label', lbl);
  const ci = p.total_chunks > 0 ? ` — ${p.chunks_done}/${p.total_chunks} chunks` : '';
  const si = p.streets_found > 0 ? ` · ${p.streets_found} streets` : '';
  set('r-chunk-info', ci + si);

  const fill = document.getElementById('r-progress-fill');
  if (!fill) return;
  const pct2 = p.total_chunks > 0 ? Math.round((p.chunks_done/p.total_chunks)*100) : 0;
  if (pct2 > 0) {
    fill.classList.remove('indet');
    fill.style.width = pct2 + '%';
  } else {
    fill.classList.add('indet');
    fill.style.width = '35%';
  }
}

function switchTab(tab) {
  currentTab = tab;
  ['missed','extra','matched','json','truth'].forEach(t => {
    const el = document.getElementById('tab-'+t);
    if (el) el.classList.toggle('active', t === tab);
  });
  _applyTabView(selectedResults);
}

function runFromPanel() {
  if (selectedDoc) runDoc({ stopPropagation: ()=>{} }, selectedDoc);
}

function renderStreetTable() {
  const tbl = document.getElementById('street-table');
  const d = selectedResults;
  if (!d) return;

  if (currentTab === 'missed') {
    const rows = d.missed || [];
    tbl.innerHTML = `
      <div class="street-row hdr"><div>Street</div><div>From</div><div>To</div><div>Tab</div></div>` +
      (rows.length ? rows.map(s=>{
        const pg = pageFromTab(s._tab);
        return `
        <div class="street-row missed${pg?' clickable':''}" ${pg?`onclick="jumpToPage(${pg})"`:''}>
          <div class="cell-name">${esc(s.main_street||'—')}</div>
          <div class="cell-limit">${esc(s.from_street||'')}</div>
          <div class="cell-limit">${esc(s.to_street||'')}</div>
          <div class="cell-tab" style="${pg?'color:var(--violet)':''}">${esc(s._tab||'')}</div>
        </div>`;
      }).join('') : '<div class="no-rows">Nothing missed</div>');

  } else if (currentTab === 'extra') {
    const rows = d.extra || [];
    tbl.innerHTML = `
      <div class="street-row hdr"><div>Street</div><div>From</div><div>To</div><div>Page</div></div>` +
      (rows.length ? rows.map(s=>{
        const pg = s.page;
        return `
        <div class="street-row extra${pg?' clickable':''}" ${pg?`onclick="jumpToPage(${pg})"`:''}>
          <div class="cell-name">${esc(s.main_street||'—')}</div>
          <div class="cell-limit">${esc(s.from_street||'')}</div>
          <div class="cell-limit">${esc(s.to_street||'')}</div>
          <div class="cell-page" style="${pg?'color:var(--violet)':''}">p.${pg||'?'}</div>
        </div>`;
      }).join('') : '<div class="no-rows">No false positives</div>');

  } else {
    const rows = d.matched || [];
    tbl.innerHTML = `
      <div class="street-row hdr" style="grid-template-columns:2fr 1.2fr 1.2fr 44px 50px">
        <div>Street</div><div>From</div><div>To</div><div>Score</div><div>Page</div>
      </div>` +
      (rows.length ? rows.map(m=>{
        const pg = m.parsed && m.parsed.page;
        return `
        <div class="street-row matched clickable" style="grid-template-columns:2fr 1.2fr 1.2fr 44px 50px"
             onclick="jumpToPage(${pg||1})">
          <div class="cell-name">${esc(m.truth.main_street||'—')}</div>
          <div class="cell-limit">${esc(m.truth.from_street||'')}</div>
          <div class="cell-limit">${esc(m.truth.to_street||'')}</div>
          <div class="cell-score">${Math.round(m.score*100)}%</div>
          <div class="cell-page" style="color:var(--violet)">p.${pg||'?'}</div>
        </div>`;
      }).join('') : '<div class="no-rows">No matches yet</div>');
  }
}

function jumpToPage(page) {
  if (!selectedDoc || !page) return;
  const frame = document.getElementById('pdf-frame');
  // Timestamp ensures a unique URL every click so Chrome always reloads + navigates
  frame.src = `/eval/pdf/${encodeURIComponent(selectedDoc)}?_=${Date.now()}#page=${page}`;
}

function pageFromTab(tab) {
  // Extract first page number from tab names like "Page 128", "Page 104-106"
  const m = String(tab||'').match(/\d+/);
  return m ? parseInt(m[0]) : null;
}

function renderLogs(bodyId, lines, autoScroll) {
  const body = document.getElementById(bodyId);
  if (!body || !lines) return;
  body.innerHTML = lines.map(entry => {
    const ts  = typeof entry==='object' ? entry.ts  : '';
    const msg = typeof entry==='object' ? entry.msg : entry;
    const lvl = typeof entry==='object' ? entry.level : 'info';
    return `<div class="log-line"><span class="log-ts">${ts}</span><span class="log-msg ${lvl}">${esc(msg)}</span></div>`;
  }).join('');
  if (autoScroll) body.scrollTop = body.scrollHeight;
}

function toggleDoneLog() {
  doneLogVisible = !doneLogVisible;
  document.getElementById('log-body-done').style.display = doneLogVisible ? '' : 'none';
  document.getElementById('log-done-toggle').textContent = doneLogVisible ? 'collapse' : 'expand';
}

// ── Run / Clear ───────────────────────────────────────────────────────────────
async function runDoc(evt, key) {
  evt.stopPropagation();
  const res = await fetch(`/eval/run?doc_key=${encodeURIComponent(key)}`, { method: 'POST' });
  const { job_id } = await res.json();
  runningJobs[key] = job_id;
  runningJobProgress[key] = {};
  selectedDoc = key;
  loadPdf(key);
  showRunningState(key);
  renderLogs('log-body-running', [{ts:'',msg:'Starting…',level:'info'}], true);
  renderDocList();
  if (!truthCache[key]) fetch(`/eval/truth/${encodeURIComponent(key)}`).then(r=>r.json()).then(d=>{ truthCache[key]=d; });
  pollJob(job_id, key);
  toast(`Running: ${key.split(' ').slice(0,3).join(' ')}…`);
}

async function clearCache(evt, key) {
  evt.stopPropagation();
  await fetch(`/eval/cache/${encodeURIComponent(key)}`, { method: 'DELETE' });
  const idx = allDocs.findIndex(d => d.key === key);
  if (idx >= 0) Object.assign(allDocs[idx], {
    has_parser_cache:false, has_eval_cache:false, f1:null, precision:null,
    recall:null, matched_count:null, missed_count:null, extra_count:null, total_parsed:null,
  });
  if (selectedDoc === key) showResEmpty();
  renderDocList(); updateSummary(); toast('Cache cleared');
}

async function runAll() {
  const btn = document.getElementById('run-all-btn');
  const lbl = document.getElementById('run-all-progress');
  const toRun = allDocs.filter(d => !d.has_eval_cache);
  if (!toRun.length) { toast('All docs already have results'); return; }
  btn.disabled = true;
  runAllTotal = toRun.length; runAllDone = 0;
  lbl.style.display = 'inline';
  document.getElementById('overall-bar-wrap').style.display = 'block';

  // Fire all jobs in parallel, then wait for all to finish
  await Promise.all(toRun.map(d =>
    fetch(`/eval/run?doc_key=${encodeURIComponent(d.key)}`, { method: 'POST' })
      .then(r => r.json())
      .then(({ job_id }) => {
        runningJobs[d.key] = job_id;
        runningJobProgress[d.key] = {};
        renderDocList();
        return new Promise(resolve => {
          pollJob(job_id, d.key, () => {
            runAllDone++;
            lbl.textContent = `${runAllDone}/${runAllTotal}`;
            document.getElementById('overall-bar').style.width = Math.round(runAllDone/runAllTotal*100)+'%';
            resolve();
          });
        });
      })
  ));

  btn.disabled = false; lbl.style.display = 'none';
  document.getElementById('overall-bar-wrap').style.display = 'none';
  toast(`Done — ${runAllTotal} docs complete`);
}

// ── Polling ───────────────────────────────────────────────────────────────────
function pollJob(job_id, doc_key, onDone) {
  const iv = setInterval(async () => {
    const res = await fetch(`/eval/job/${job_id}`);
    const job = await res.json();
    if (job.progress) runningJobProgress[doc_key] = job.progress;

    // Update card in list
    const cardEl = document.getElementById('card-'+cid(doc_key));
    if (cardEl) cardEl.outerHTML = renderCard(allDocs.find(x=>x.key===doc_key)||{});

    // Update live running panel if this doc is selected
    if (selectedDoc === doc_key) {
      if (job.progress) updateRunningHeader(job.progress);
      if (job.log) renderLogs('log-body-running', job.log, true);
    }

    if (job.status === 'done') {
      clearInterval(iv);
      delete runningJobs[doc_key]; delete runningJobProgress[doc_key];
      const idx = allDocs.findIndex(d => d.key === doc_key);
      if (idx >= 0 && job.result) Object.assign(allDocs[idx], {
        f1: job.result.f1, precision: job.result.precision, recall: job.result.recall,
        matched_count: job.result.matched_count, missed_count: job.result.missed_count,
        extra_count: job.result.extra_count, total_truth: job.result.total_truth,
        total_parsed: job.result.total_parsed, has_eval_cache: true,
      });
      renderDocList(); updateSummary();

      // Transition to done state if still selected
      if (selectedDoc === doc_key) {
        const r = await fetch(`/eval/results/${encodeURIComponent(doc_key)}`);
        const data = await r.json();
        if (!data.error) {
          selectedResults = data;
          currentTab = 'missed';
          showDoneState(data);
          // Copy live logs into done log panel
          if (job.log) renderLogs('log-body-done', job.log, false);
        }
      }
      if (onDone) onDone();

    } else if (job.status === 'error') {
      clearInterval(iv);
      delete runningJobs[doc_key]; delete runningJobProgress[doc_key];
      if (selectedDoc === doc_key) {
        set('r-phase-label', 'Error');
        set('r-chunk-info', job.error || '');
      }
      toast(`Error: ${job.error}`);
      renderDocList();
      if (onDone) onDone();
    }
  }, 2000);
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function pct(v) { return v != null ? Math.round(v*100)+'%' : '—'; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function set(id, val) { const el=document.getElementById(id); if(el) el.textContent=val; }
function cid(k) { return k.replace(/[^a-z0-9]/gi,'_'); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

init();
</script>
</body>
</html>
