<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bid Parser — Eval</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; color: #222; min-height: 100vh; }

    /* ── Header ── */
    header {
      background: #1a1a2e; color: white;
      padding: 14px 24px; display: flex; align-items: center; gap: 16px;
    }
    header h1 { font-size: 1rem; font-weight: 600; flex: 1; }
    header a { color: #a5b4fc; font-size: 0.8rem; text-decoration: none; }
    header a:hover { color: white; }

    /* ── Summary bar ── */
    .summary-bar {
      background: white; border-bottom: 1px solid #ddd;
      padding: 14px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat .val { font-size: 1.4rem; font-weight: 700; color: #1a1a2e; }
    .stat .lbl { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
    .summary-bar .actions { margin-left: auto; display: flex; gap: 8px; }
    .btn { border: none; border-radius: 6px; padding: 8px 16px; font-size: 0.82rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-primary:hover { background: #3730a3; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
    .btn-danger  { background: #fee2e2; color: #b91c1c; }
    .btn-danger:hover  { background: #fecaca; }
    .btn-sm { padding: 5px 10px; font-size: 0.75rem; }

    /* ── Layout ── */
    .layout { display: flex; height: calc(100vh - 109px); }

    /* ── Doc list ── */
    .doc-list {
      width: 420px; min-width: 420px; overflow-y: auto;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .doc-card {
      background: white; border: 2px solid #e5e5e5; border-radius: 10px;
      padding: 14px 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
    }
    .doc-card:hover { border-color: #a5b4fc; box-shadow: 0 2px 8px rgba(79,70,229,.1); }
    .doc-card.active { border-color: #4f46e5; }
    .doc-card.running { border-color: #f59e0b; animation: pulse .8s infinite alternate; }
    @keyframes pulse { from { border-color: #f59e0b; } to { border-color: #fbbf24; } }

    .card-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .card-name { font-size: 0.8rem; font-weight: 600; color: #1a1a2e; flex: 1; line-height: 1.4; }
    .card-actions { display: flex; gap: 5px; flex-shrink: 0; }

    .f1-bar-wrap { margin-bottom: 8px; }
    .f1-label { display: flex; justify-content: space-between; font-size: 0.7rem; color: #888; margin-bottom: 3px; }
    .f1-label strong { color: #1a1a2e; font-size: 0.85rem; }
    .f1-track { height: 6px; background: #e5e5e5; border-radius: 3px; overflow: hidden; }
    .f1-fill  { height: 100%; border-radius: 3px; transition: width .4s; }
    .f1-fill.good   { background: #22c55e; }
    .f1-fill.ok     { background: #f59e0b; }
    .f1-fill.bad    { background: #ef4444; }
    .f1-fill.none   { background: #d1d5db; }

    .prf-row { display: flex; gap: 10px; margin-bottom: 8px; }
    .prf-chip { background: #f4f4ff; border: 1px solid #e0e0ff; border-radius: 5px; padding: 3px 8px; font-size: 0.7rem; }
    .prf-chip span { font-weight: 700; }

    .counts-row { display: flex; gap: 8px; }
    .count-badge { font-size: 0.7rem; font-weight: 600; padding: 2px 7px; border-radius: 10px; }
    .count-matched { background: #dcfce7; color: #166534; }
    .count-missed  { background: #fee2e2; color: #991b1b; }
    .count-extra   { background: #fef9c3; color: #854d0e; }

    .cache-row { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .cache-badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 8px; font-weight: 600; }
    .cache-hit  { background: #dbeafe; color: #1d4ed8; }
    .cache-miss { background: #f3f4f6; color: #9ca3af; }
    .cache-time { font-size: 0.65rem; color: #aaa; }

    .status-pending { color: #9ca3af; font-size: 0.78rem; text-align: center; padding: 12px 0; }
    .status-running { color: #f59e0b; font-size: 0.78rem; text-align: center; padding: 6px 0; }
    .status-error   { color: #ef4444; font-size: 0.75rem; padding: 6px 0; }

    /* ── Detail panel ── */
    .detail-panel {
      flex: 1; background: white; border-left: 1px solid #ddd;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .detail-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: #aaa; font-size: 0.9rem; flex-direction: column; gap: 8px;
    }
    .detail-header {
      padding: 14px 20px; border-bottom: 1px solid #ddd;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .detail-title { font-size: 0.85rem; font-weight: 700; flex: 1; }
    .detail-scores { display: flex; gap: 12px; }
    .dscore { text-align: center; }
    .dscore .dv { font-size: 1.1rem; font-weight: 700; }
    .dscore .dl { font-size: 0.65rem; color: #888; text-transform: uppercase; }
    .dscore.dp .dv { color: #4f46e5; }
    .dscore.dr .dv { color: #0891b2; }
    .dscore.df .dv { color: #059669; }

    .tabs { display: flex; border-bottom: 1px solid #e5e5e5; padding: 0 20px; }
    .tab-btn {
      padding: 10px 16px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      border: none; background: none; border-bottom: 2px solid transparent; color: #888;
    }
    .tab-btn.active { color: #4f46e5; border-bottom-color: #4f46e5; }

    .street-table { flex: 1; overflow-y: auto; }
    .street-row {
      display: grid; grid-template-columns: 2fr 1.5fr 1.5fr 80px;
      padding: 9px 20px; border-bottom: 1px solid #f0f0f0; font-size: 0.78rem;
      align-items: center;
    }
    .street-row:hover { background: #fafafa; }
    .street-row.header { font-weight: 700; font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: .4px; color: #888; background: #f9f9f9; position: sticky; top: 0; }
    .street-row.missed-row  { background: #fff8f8; }
    .street-row.extra-row   { background: #fffef0; }
    .street-row.matched-row { background: #f0fdf4; }
    .cell-main { font-weight: 600; color: #1a1a2e; }
    .cell-from-to { color: #555; }
    .cell-page { color: #999; font-size: 0.72rem; }
    .cell-score { color: #059669; font-size: 0.72rem; font-weight: 600; }
    .cell-tab { color: #888; font-size: 0.68rem; }

    .log-panel {
      background: #0f1117; border-radius: 6px; margin: 12px 20px; overflow: hidden;
    }
    .log-header { background: #1e2130; color: #888; font-size: 0.68rem; padding: 4px 10px; letter-spacing: 1px; text-transform: uppercase; }
    .log-body { max-height: 120px; overflow-y: auto; padding: 8px 10px; }
    .log-line { color: #a8ff78; font-size: 0.72rem; font-family: monospace; line-height: 1.6; white-space: pre-wrap; }

    .no-results { color: #aaa; text-align: center; padding: 40px; font-size: 0.85rem; }

    .toast { position: fixed; bottom: 20px; right: 20px; background: #1a1a2e; color: white;
      padding: 10px 16px; border-radius: 7px; font-size: 0.82rem;
      opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>Bid Parser — Eval Dashboard</h1>
  <a href="/">← Back to Parser</a>
</header>

<div class="summary-bar" id="summary-bar">
  <div class="stat"><div class="val" id="s-docs">—</div><div class="lbl">Documents</div></div>
  <div class="stat"><div class="val" id="s-truth">—</div><div class="lbl">Truth Streets</div></div>
  <div class="stat"><div class="val" id="s-f1" style="color:#059669">—</div><div class="lbl">Overall F1</div></div>
  <div class="stat"><div class="val" id="s-recall" style="color:#0891b2">—</div><div class="lbl">Overall Recall</div></div>
  <div class="stat"><div class="val" id="s-precision" style="color:#4f46e5">—</div><div class="lbl">Overall Precision</div></div>
  <div class="actions">
    <button class="btn btn-primary" id="run-all-btn" onclick="runAll()">▶ Run All</button>
  </div>
</div>

<div class="layout">
  <!-- Doc list -->
  <div class="doc-list" id="doc-list">
    <p style="color:#aaa;font-size:.85rem;text-align:center;padding:20px">Loading...</p>
  </div>

  <!-- Detail panel -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty" id="detail-empty">
      <div style="font-size:2.5rem">📊</div>
      <div>Click a document to see results</div>
    </div>
    <div id="detail-content" style="display:none; display:flex; flex-direction:column; flex:1; overflow:hidden;">
      <div class="detail-header">
        <div class="detail-title" id="d-title">—</div>
        <div class="detail-scores">
          <div class="dscore dp"><div class="dv" id="d-precision">—</div><div class="dl">Precision</div></div>
          <div class="dscore dr"><div class="dv" id="d-recall">—</div><div class="dl">Recall</div></div>
          <div class="dscore df"><div class="dv" id="d-f1">—</div><div class="dl">F1</div></div>
        </div>
        <div style="display:flex;gap:6px">
          <span class="count-badge count-matched" id="d-matched">—</span>
          <span class="count-badge count-missed" id="d-missed">—</span>
          <span class="count-badge count-extra" id="d-extra">—</span>
        </div>
      </div>
      <!-- Log console -->
      <div id="log-wrap" style="display:none">
        <div class="log-console" style="margin:10px 20px 0">
          <div class="log-header" style="display:flex;justify-content:space-between;align-items:center">
            <span>RUN LOG</span>
            <span id="log-toggle" onclick="toggleLog()" style="cursor:pointer;font-size:0.7rem;color:#a5b4fc">▼ hide</span>
          </div>
          <div class="log-body" id="log-body" style="max-height:180px"></div>
        </div>
      </div>

      <div class="tabs" style="margin-top:10px">
        <button class="tab-btn active" onclick="switchTab('missed')" id="tab-missed">❌ Missed</button>
        <button class="tab-btn" onclick="switchTab('extra')" id="tab-extra">➕ Extra</button>
        <button class="tab-btn" onclick="switchTab('matched')" id="tab-matched">✅ Matched</button>
      </div>
      <div class="street-table" id="street-table"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allDocs = [];
let selectedDoc = null;
let selectedResults = null;
let currentTab = 'missed';
let runningJobs = {};  // doc_key -> job_id

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  await loadDocs();
}

async function loadDocs() {
  const res = await fetch('/eval/docs');
  allDocs = await res.json();
  renderDocList();
  updateSummary();
}

// ── Summary bar ───────────────────────────────────────────────────────────────

function updateSummary() {
  const withResults = allDocs.filter(d => d.f1 !== null);
  document.getElementById('s-docs').textContent = allDocs.length;
  const totalTruth = allDocs.reduce((s, d) => s + (d.total_truth || 0), 0);
  document.getElementById('s-truth').textContent = totalTruth.toLocaleString();

  if (withResults.length === 0) {
    ['s-f1','s-recall','s-precision'].forEach(id => document.getElementById(id).textContent = '—');
    return;
  }

  const totalMatched = withResults.reduce((s, d) => s + (d.matched_count || 0), 0);
  const totalMissed  = withResults.reduce((s, d) => s + (d.missed_count || 0), 0);
  const totalExtra   = withResults.reduce((s, d) => s + (d.extra_count || 0), 0);
  const totalTruthR  = withResults.reduce((s, d) => s + (d.total_truth || 0), 0);

  const p  = totalMatched / (totalMatched + totalExtra) || 0;
  const r  = totalMatched / totalTruthR || 0;
  const f1 = 2 * p * r / (p + r) || 0;

  document.getElementById('s-f1').textContent        = pct(f1);
  document.getElementById('s-recall').textContent    = pct(r);
  document.getElementById('s-precision').textContent = pct(p);
}

// ── Doc list ──────────────────────────────────────────────────────────────────

function renderDocList() {
  const list = document.getElementById('doc-list');
  list.innerHTML = allDocs.map(d => renderCard(d)).join('');
}

function renderCard(d) {
  const isRunning = runningJobs[d.key] != null;
  const hasResult = d.f1 !== null;
  const f1 = d.f1 || 0;
  const fillClass = !hasResult ? 'none' : f1 >= 0.8 ? 'good' : f1 >= 0.5 ? 'ok' : 'bad';
  const fillPct = hasResult ? Math.round(f1 * 100) : 0;
  const active = selectedDoc === d.key ? 'active' : '';
  const running = isRunning ? 'running' : '';

  const f1Bar = `
    <div class="f1-bar-wrap">
      <div class="f1-label">
        <span>F1 Score</span>
        <strong>${hasResult ? pct(f1) : '—'}</strong>
      </div>
      <div class="f1-track"><div class="f1-fill ${fillClass}" style="width:${fillPct}%"></div></div>
    </div>`;

  const prfRow = hasResult ? `
    <div class="prf-row">
      <div class="prf-chip">P <span>${pct(d.precision)}</span></div>
      <div class="prf-chip">R <span>${pct(d.recall)}</span></div>
      <div class="prf-chip">Truth <span>${d.total_truth}</span></div>
      <div class="prf-chip">Parsed <span>${d.total_parsed}</span></div>
    </div>` : '';

  const countsRow = hasResult ? `
    <div class="counts-row">
      <span class="count-badge count-matched">✓ ${d.matched_count} matched</span>
      <span class="count-badge count-missed">✗ ${d.missed_count} missed</span>
      <span class="count-badge count-extra">+ ${d.extra_count} extra</span>
    </div>` : '';

  const cacheRow = `
    <div class="cache-row">
      <span class="cache-badge ${d.has_parser_cache ? 'cache-hit' : 'cache-miss'}">
        ${d.has_parser_cache ? '📦 parser cached' : '⭕ no parser cache'}
      </span>
      ${d.eval_cache_time ? `<span class="cache-time">eval: ${d.eval_cache_time}</span>` : ''}
    </div>`;

  const statusArea = isRunning
    ? `<div class="status-running" id="status-${d.key.replace(/[^a-z0-9]/gi,'_')}">⏳ Running...</div>`
    : !hasResult
      ? `<div class="status-pending">Not run yet</div>`
      : '';

  const runBtn = `<button class="btn btn-primary btn-sm" onclick="runDoc(event,'${esc(d.key)}')" ${isRunning?'disabled':''}>▶ Run</button>`;
  const clearBtn = d.has_parser_cache || d.has_eval_cache
    ? `<button class="btn btn-danger btn-sm" onclick="clearCache(event,'${esc(d.key)}')">🗑 Clear</button>` : '';

  return `
    <div class="doc-card ${active} ${running}" id="card-${cardId(d.key)}" onclick="selectDoc('${esc(d.key)}')">
      <div class="card-top">
        <div class="card-name">${d.key}</div>
        <div class="card-actions">${runBtn}${clearBtn}</div>
      </div>
      ${f1Bar}${prfRow}${countsRow}${cacheRow}${statusArea}
    </div>`;
}

// ── Doc selection ─────────────────────────────────────────────────────────────

async function selectDoc(key) {
  selectedDoc = key;
  renderDocList();

  const res = await fetch(`/eval/results/${encodeURIComponent(key)}`);
  const data = await res.json();

  if (data.error) {
    document.getElementById('detail-empty').style.display = 'flex';
    document.getElementById('detail-content').style.display = 'none';
    return;
  }

  selectedResults = data;
  currentTab = 'missed';
  renderDetail();
}

let logVisible = true;
function toggleLog() {
  logVisible = !logVisible;
  document.getElementById('log-body').style.display = logVisible ? '' : 'none';
  document.getElementById('log-toggle').textContent = logVisible ? '▼ hide' : '▶ show';
}

function showLogs(lines, running) {
  const wrap = document.getElementById('log-wrap');
  const body = document.getElementById('log-body');
  if (!lines || lines.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  body.innerHTML = lines.map(l => `<div class="log-line">${esc(l)}</div>`).join('');
  if (running || logVisible) body.scrollTop = body.scrollHeight;
}

function renderDetail() {
  const d = selectedResults;
  document.getElementById('detail-empty').style.display = 'none';
  document.getElementById('detail-content').style.display = 'flex';

  document.getElementById('d-title').textContent     = d.doc_key;
  document.getElementById('d-precision').textContent = pct(d.precision);
  document.getElementById('d-recall').textContent    = pct(d.recall);
  document.getElementById('d-f1').textContent        = pct(d.f1);
  document.getElementById('d-matched').textContent   = `✓ ${d.matched_count} matched`;
  document.getElementById('d-missed').textContent    = `✗ ${d.missed_count} missed`;
  document.getElementById('d-extra').textContent     = `+ ${d.extra_count} extra`;
  showLogs(d.logs || [], false);

  ['missed','extra','matched'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === currentTab);
  });

  renderStreetTable();
}

function switchTab(tab) {
  currentTab = tab;
  if (selectedResults) renderDetail();
}

function renderStreetTable() {
  const tbl = document.getElementById('street-table');
  const d = selectedResults;
  let rows, rowClass, cols;

  if (currentTab === 'missed') {
    rows = d.missed || [];
    rowClass = 'missed-row';
    cols = ['main_street','from_street','to_street','_tab'];
    tbl.innerHTML = `
      <div class="street-row header">
        <div>Street</div><div>From</div><div>To</div><div>Tab</div>
      </div>` + (rows.length ? rows.map(s => `
      <div class="street-row ${rowClass}">
        <div class="cell-main">${esc(s.main_street||'—')}</div>
        <div class="cell-from-to">${esc(s.from_street||'')}</div>
        <div class="cell-from-to">${esc(s.to_street||'')}</div>
        <div class="cell-tab">${esc(s._tab||'')}</div>
      </div>`).join('') : '<div class="no-results">None missed 🎉</div>');

  } else if (currentTab === 'extra') {
    rows = d.extra || [];
    rowClass = 'extra-row';
    tbl.innerHTML = `
      <div class="street-row header">
        <div>Street</div><div>From</div><div>To</div><div>Page</div>
      </div>` + (rows.length ? rows.map(s => `
      <div class="street-row ${rowClass}">
        <div class="cell-main">${esc(s.main_street||'—')}</div>
        <div class="cell-from-to">${esc(s.from_street||'')}</div>
        <div class="cell-from-to">${esc(s.to_street||'')}</div>
        <div class="cell-page">p.${s.page||'?'}</div>
      </div>`).join('') : '<div class="no-results">No false positives 🎉</div>');

  } else {
    rows = d.matched || [];
    rowClass = 'matched-row';
    tbl.innerHTML = `
      <div class="street-row header" style="grid-template-columns:2fr 1.5fr 1.5fr 60px 60px">
        <div>Street</div><div>From</div><div>To</div><div>Score</div><div>Page</div>
      </div>` + (rows.length ? rows.map(m => `
      <div class="street-row ${rowClass}" style="grid-template-columns:2fr 1.5fr 1.5fr 60px 60px">
        <div class="cell-main">${esc(m.truth.main_street||'—')}</div>
        <div class="cell-from-to">${esc(m.truth.from_street||'')}</div>
        <div class="cell-from-to">${esc(m.truth.to_street||'')}</div>
        <div class="cell-score">${Math.round(m.score*100)}%</div>
        <div class="cell-page">p.${m.parsed&&m.parsed.page||'?'}</div>
      </div>`).join('') : '<div class="no-results">No matches yet</div>');
  }
}

// ── Run / Clear ───────────────────────────────────────────────────────────────

async function runDoc(evt, key) {
  evt.stopPropagation();
  const forceReparse = false;
  const res = await fetch(`/eval/run?doc_key=${encodeURIComponent(key)}&force_reparse=${forceReparse}`, { method: 'POST' });
  const { job_id } = await res.json();
  runningJobs[key] = job_id;
  // If this doc is selected, open detail panel and show live log immediately
  selectedDoc = key;
  document.getElementById('detail-empty').style.display = 'none';
  document.getElementById('detail-content').style.display = 'flex';
  document.getElementById('d-title').textContent = key;
  ['d-precision','d-recall','d-f1'].forEach(id => document.getElementById(id).textContent = '—');
  showLogs(['Starting...'], true);
  renderDocList();
  pollJob(job_id, key);
  toast(`Started eval for ${key.split(' ')[0]}...`);
}

async function clearCache(evt, key) {
  evt.stopPropagation();
  await fetch(`/eval/cache/${encodeURIComponent(key)}`, { method: 'DELETE' });
  // Reload doc info
  const idx = allDocs.findIndex(d => d.key === key);
  if (idx >= 0) {
    allDocs[idx].has_parser_cache = false;
    allDocs[idx].has_eval_cache = false;
    allDocs[idx].f1 = null; allDocs[idx].precision = null;
    allDocs[idx].recall = null; allDocs[idx].matched_count = null;
    allDocs[idx].missed_count = null; allDocs[idx].extra_count = null;
  }
  if (selectedDoc === key) {
    selectedResults = null;
    document.getElementById('detail-empty').style.display = 'flex';
    document.getElementById('detail-content').style.display = 'none';
  }
  renderDocList();
  updateSummary();
  toast('Cache cleared');
}

async function runAll() {
  const btn = document.getElementById('run-all-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Running...';
  // Run docs sequentially that don't already have eval results
  const toRun = allDocs.filter(d => !d.has_eval_cache);
  toast(`Running ${toRun.length} docs sequentially...`);

  for (const d of toRun) {
    await new Promise(resolve => {
      fetch(`/eval/run?doc_key=${encodeURIComponent(d.key)}`, { method: 'POST' })
        .then(r => r.json())
        .then(({ job_id }) => {
          runningJobs[d.key] = job_id;
          renderDocList();
          pollJob(job_id, d.key, resolve);
        });
    });
  }
  btn.disabled = false;
  btn.textContent = '▶ Run All';
  toast('All docs complete!');
}

// ── Polling ───────────────────────────────────────────────────────────────────

function pollJob(job_id, doc_key, onDone) {
  const interval = setInterval(async () => {
    const res = await fetch(`/eval/job/${job_id}`);
    const job = await res.json();

    // Update log if card is selected
    const idx = allDocs.findIndex(d => d.key === doc_key);

    if (job.status === 'done') {
      clearInterval(interval);
      delete runningJobs[doc_key];
      if (idx >= 0 && job.result) {
        Object.assign(allDocs[idx], {
          f1: job.result.f1, precision: job.result.precision, recall: job.result.recall,
          matched_count: job.result.matched_count, missed_count: job.result.missed_count,
          extra_count: job.result.extra_count, total_truth: job.result.total_truth,
          total_parsed: job.result.total_parsed, has_eval_cache: true,
        });
      }
      renderDocList();
      updateSummary();
      if (selectedDoc === doc_key) selectDoc(doc_key);
      if (onDone) onDone();
    } else if (job.status === 'error') {
      clearInterval(interval);
      delete runningJobs[doc_key];
      toast(`Error on ${doc_key}: ${job.error}`);
      renderDocList();
      if (onDone) onDone();
    } else {
      // Still running — update status text in card
      const el = document.getElementById('status-' + doc_key.replace(/[^a-z0-9]/gi,'_'));
      if (el && job.log.length) el.textContent = '⏳ ' + job.log[job.log.length - 1];
      // If this doc is currently selected, stream logs live
      if (selectedDoc === doc_key) showLogs(job.log, true);
    }
  }, 2000);
}

// ── Utils ─────────────────────────────────────────────────────────────────────

function pct(v) { return v != null ? Math.round(v * 100) + '%' : '—'; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cardId(k) { return k.replace(/[^a-z0-9]/gi,'_'); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

init();
</script>
